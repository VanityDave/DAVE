<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanityDave's Homepage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    radial-gradient(circle at 50% 15%,
        rgba(255,215,100,0.25) 0%,
        transparent 35%
    ),

    linear-gradient(
        115deg,
        rgba(255,215,100,0.06) 0%,
        transparent 20%,
        rgba(255,255,255,0.03) 25%,
        transparent 45%,
        rgba(255,215,100,0.04) 50%,
        transparent 70%
    ),

    repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.015) 0px,
        rgba(255,255,255,0.015) 2px,
        transparent 2px,
        transparent 140px
    ),

    linear-gradient(
        145deg,
        #050505,
        #0f0f0f 20%,
        #1a1a1a 40%,
        #090909 60%,
        #141414 80%,
        #040404
    );
}

body::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        90deg,
        transparent 0%,
        rgba(212,175,55,0.12) 15%,
        transparent 30%,
        rgba(212,175,55,0.08) 50%,
        transparent 70%,
        rgba(212,175,55,0.10) 85%,
        transparent 100%
    );

    pointer-events:none;
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    width:90%;
    max-width:550px;
}

h1{
    color:#f5c542;
    font-size:3.2rem;
    font-weight:900;
    text-shadow:
        0 0 10px rgba(255,215,100,0.7),
        0 0 25px rgba(255,215,100,0.5),
        0 4px 0 #000;
    margin-bottom:30px;
}

.button{
    display:block;
    width:100%;
    padding:22px;
    margin:18px 0;
    border:none;
    border-radius:20px;
    font-size:2rem;
    font-weight:900;
    cursor:pointer;
    text-decoration:none;
    color:#050505;
    background:linear-gradient(#f7d56a,#b8860b);
    border:3px solid white;
    box-shadow:
        0 8px 0 #4a2f00,
        0 0 20px rgba(245,197,66,.6);
    transition:.15s;
}

.button:hover{
    transform:scale(1.02);
}

.button:active{
    transform:translateY(4px);
    box-shadow:
        0 4px 0 #4a2f00,
        0 0 15px rgba(245,197,66,.6);
}
</style>

</head>
<body>

<div class="container">

<h1>VanityDave's Homepage</h1>

<p style="
color:white;
font-size:1.15rem;
font-weight:600;
line-height:1.6;
margin-bottom:35px;
text-shadow:0 0 8px rgba(0,0,0,.8);
">
Created to support the Hunt Royale community with guides, showcases, and helpful content.

<br><br>

We are all one community. Respectful gameplay, fair competition, and friendly communication should always come first.
</p>

<a class="button" href="youtube.html">
YouTube Videos
</a>

<a class="button" href="discord.html">
Discord Server
</a>

</div>

</body>
</html>
